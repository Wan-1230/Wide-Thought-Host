# cargo-deny configuration for WTH Build.
#
# Supply-chain gates that cargo-audit does not cover: license compatibility with
# an Apache-2.0 release, dependency provenance (registry / git), and duplicate
# version sprawl. Advisory exemptions are *shared* with cargo-audit, see below.
#
# !! cargo-deny does NOT auto-discover this file -- it looks for `deny.toml`
# !! only. Every invocation must pass `--config cargo-deny.toml`, otherwise you
# !! silently get cargo-deny's built-in defaults instead of this config. Bare
# !! `cargo deny check` in this repo is a footgun, not a check: with no config
# !! its built-in allow list is empty, so it rejects every crate in the tree.
#
# Working invocation (verified locally 2026-09-23 against cargo-deny 0.20.2):
#
#     cargo deny --config cargo-deny.toml check
#
# Measured result at the time of writing:
#
#     bans ok, licenses ok, sources ok
#     advisories FAILED -- 4 real vulnerabilities that have upgrades available:
#       RUSTSEC-2026-0285 rustls 0.23.37   -> >=0.23.45  (TLS 1.3 handshake accept)
#       RUSTSEC-2026-0258 h2 0.4.15        -> >=0.4.16   (unbounded empty DATA)
#       RUSTSEC-2026-0257 webbrowser 1.0.6 -> >=1.2.2    (BROWSER arg injection)
#       RUSTSEC-2026-0274 rtrb 0.3.2       -> ^0.3.5     (double free in ReadChunk)
#     ...plus 3 yanked warnings (aes 0.9.0, spin 0.9.8, spin 0.10.0) and 49
#     wildcard warnings that are all first-party path deps, see [bans] below.
#
# Those 4 are deliberately NOT ignored here: they have fixes. This config is
# honest about the tree being dirty, same posture as the cargo-audit job ("block
# new unignored vulns", not "tree is clean").
#
# Schema: cargo-deny 0.20.x. 0.20 removed the `unlicensed`, `default`,
# `copyleft` and `allow-osi-fsf-free` keys -- `[licenses] allow` is now itself a
# hard allowlist, so anything not listed there is rejected. `[bans]
# multiple-versions` is also a plain lint level again, not the
# `{ workspace = ... }` table some earlier docs showed.

# ─── Graph ────────────────────────────────────────────────────────────────────
[graph]
# Empty = every target triple cargo reports. WTH ships Windows, macOS and Linux
# binaries, so restricting this to the host triple would blind the check to the
# windows-* / nix / zbus subtrees, which is where most of the sprawl lives.
targets = []
all-features = false
no-default-features = false

# ─── Advisories ───────────────────────────────────────────────────────────────
[advisories]
# db-urls / db-path stay at cargo-deny's defaults (the RustSec advisory db under
# $CARGO_HOME/advisory-dbs), the same source cargo-audit reads.

# Vulnerabilities are the only advisory class this tool gates. In cargo-deny 0.20
# `unmaintained` and `unsound` are a *scope* (`all`/`workspace`/`transitive`/
# `none`), not a lint level, and at `all` they turn 20 inherited crates
# (anyhow, git2, bincode, the unic-* and yaml-rust families, ...) into hard
# errors -- a policy the cargo-audit job in CI already sets, deliberately, to
# warn-not-fail. Reporting them twice in two tools means two lists to disagree.
# So: cargo-audit owns "is this crate still maintained" as a warning, cargo-deny
# owns "is this crate vulnerable" as a gate. Nothing is dropped, and `cargo audit
# --info` output still lists every one of them.
# Measured 2026-09-23: `unmaintained = "workspace"` does filter (15 -> 0), but
# `unsound = "workspace"` does not (5 -> 5), so `none` is the only setting that
# gives the posture above.
unmaintained = "none"
unsound = "none"
yanked = "warn"

# SINGLE SOURCE OF TRUTH for exemptions is .cargo/audit.toml, because that is the
# list the existing cargo-audit hard gate actually reads. Everything between the
# markers below is generated from it. Edit .cargo/audit.toml, then run
# `python scripts/sync_advisory_ignore.py` and commit both files.
#
# Verified, not assumed: rsa 0.9.10 and quick-xml 0.38.3/0.39.4 are both in this
# graph, so RUSTSEC-2023-0071 / -2026-0194 / -2026-0195 would each be a hard error
# without the three lines below. `cargo deny --config cargo-deny.toml check
# advisories` reports none of them. Likewise r-efi 5.3.0 carries an LGPL arm and
# `check licenses` passes with LGPL absent from `allow`, which confirms cargo-deny
# resolved it via the MIT arm rather than overlooking it.
ignore = [
    # BEGIN generated:advisory-ignore (source: .cargo/audit.toml) -- do not edit
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # END generated:advisory-ignore
]

# ─── Licenses ─────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8

# Conservative by construction: only licenses under which we may distribute an
# Apache-2.0 binary with no source-disclosure obligation on our side.
#
# Every entry below is here because `cargo deny list` found it in this graph --
# there is no dead weight in the list. The non-obvious ones:
#
#   MPL-2.0              file-level (weak) copyleft, and *not* offered under an
#                        alternative license. cssparser, cssparser-macros,
#                        dtoa-short, option-ext, selectors and the nucleo git dep
#                        are MPL-2.0 only. Compatible with an Apache-2.0 release:
#                        the obligation attaches to the MPL files themselves,
#                        which stay MPL, and creates no obligation toward our own
#                        code. Accepted deliberately, not by omission.
#   CDLA-Permissive-2.0  webpki-roots / webpki-root-certs. A *data* license over
#                        the bundled Mozilla root-certificate set, not a code
#                        license; permissive, notice-preserving.
#   Unlicense            memchr, aho-corasick, jiff, walkdir, globset, ignore,
#                        byteorder and friends. Public-domain dedication,
#                        permissive. Called out because it is NOT OSI-approved and
#                        grants no express patent license -- the usual reason orgs
#                        avoid it. Each of these also offers MIT.
#   MIT-0 / 0BSD         zero-attribution, public-domain-equivalent variants.
#   BSD-1-Clause         fiat-crypto only.
#   BSL-1.0              Boost; permissive, includes a patent grant.
#   Unicode-3.0          the Unicode data license used by the icu-*/unicode-* crates.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Deliberately NOT allowed, with the reason recorded so nobody adds it back
# without reading this. LGPL-2.1-or-later appears in exactly one crate, r-efi,
# where it is one arm of `MIT OR Apache-2.0 OR LGPL-2.1-or-later`. cargo-deny
# evaluates an OR by requiring one allowed arm, so r-efi passes on MIT and the
# LGPL arm remains something we have not permitted. Do NOT add LGPL-* to `allow`:
# that would convert a license we merely declined into one we grant globally.
# GPL-1.0/2.0/3.0, AGPL-3.0 and SSPL-1.0 are likewise absent from the graph; if
# one arrives, the fix is to remove or vendor the crate, not to widen this list.
exceptions = []

# ─── Sources ─────────────────────────────────────────────────────────────────
[sources]
# Nothing may be fetched from a location not listed here. This is what makes "no
# surprise vendored code" checkable, and it backs the privacy posture: no
# third-party hosted crate source, therefore no new network endpoint.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The only git dependency in the tree: nucleo (helix's fuzzy matcher), pinned to
# a rev in the root Cargo.toml. A rev pin is deliberate -- the alternative is a
# floating branch, which is strictly worse for provenance.
allow-git = ["https://github.com/helix-editor/nucleo.git"]

# Workspace `path` deps (crates/*, prod/*, third_party/*) are first-party to
# cargo-deny and so are not gated here. Worth naming: third_party/{dagre_rust,
# graphlib_rust,mermaid-to-svg,ordered_hashmap} are vendored *forks* of upstream
# crates living in-tree, so they bypass the source gate by construction. They are
# still license-checked. They are the first place to look if a license finding
# appears that does not match its upstream namesake.

# ─── Duplicate versions ───────────────────────────────────────────────────────
[bans]
# cargo-deny 0.20 takes a lint level here, not the `{ workspace = ... }` table
# form that earlier versions documented. Duplicate detection spans the whole
# resolved graph either way.
multiple-versions = "deny"
# `*` as a version requirement is the same family of provenance hole as an
# unlisted git source: nothing pins what gets resolved. Left at `warn`, not
# `deny`, because every one of the 49 findings cargo-deny produces here is a
# first-party in-repo `path` dependency declared without a `version` key (measured
# 2026-09-23 via `cargo deny check bans`; zero third-party wildcard requirements
# exist in this tree). Escalating to `deny` would fail CI on our own workspace.
# Do not flip it to `allow` either: that is the setting under which a genuine
# third-party `*` would arrive unnoticed.
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# What this list does and does not gate -- measured on cargo-deny 0.20.2, not
# assumed, because the obvious reading of `versions = [...]` is wrong:
#
#   * A `skip` entry silences the named CRATE wholesale as soon as *any* one of
#     the listed versions matches -- or unconditionally if `versions` is empty.
#     Verified: a crate with 3 versions in the graph produced no report with only
#     1 of its 3 versions listed. So `versions` is documentation of the exact set
#     reviewed, NOT a per-version ratchet.
#   * Consequence, stated plainly: a *new* version of a crate already named here
#     will NOT trip this gate.
#   * What it does catch is sprawl widening to a crate not named here. Verified:
#     deleting one entry made that crate report again immediately. With 120 crates
#     listed, any new duplicate brought in by a new dependency fails CI, which is
#     the realistic regression -- a fresh dep dragging in its own older-generation
#     stack, not a 7th windows-sys.
#
# Read `reason` as "who pins this, and what would have to move to delete the
# line". Deleting a line is the goal; every line is independently checkable
# against `cargo tree -d`.
