# Wide Thought Host (WTH) - default configuration template
# Place at: ~/.wth/config.toml  (or $WTH_HOME/config.toml)
# Migration: ~/.grok/config.toml is read as fallback if ~/.wth doesn't exist.
# Run `wth inspect` to see the effective configuration for a directory.

# -- LLM endpoint -------------------------------------------------------------
# WTH talks to any OpenAI-compatible endpoint. Configure the base URL and key
# via env vars (WTH_API_BASE_URL / GROK_XAI_API_BASE_URL, WTH_API_KEY /
# XAI_API_KEY) or via the [endpoints] section below. The CLI's default
# endpoint is the public xAI (Grok) API; there is no `[backends.*]` table.

[endpoints]
# xai_api_base_url = "https://api.openai.com/v1"
# models_base_url = "https://api.openai.com/v1"

# -- UI / TUI -----------------------------------------------------------------

[ui]
theme = "dark"              # dark | light | solarized | custom
# default_panels = ["chat", "diff"]

# -- Agent --------------------------------------------------------------------
# Select which agent definition the TUI uses for new sessions.

[agent]
# name = "grok-build"
# definition = "$HOME/.wth/agents/my-agent.md"

# -- Features -----------------------------------------------------------------

[features]
# telemetry = false   # off | local | remote
