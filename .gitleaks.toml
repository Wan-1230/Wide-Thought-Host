# gitleaks 基线配置
#
# 历史遗留：提交 abd3978798bab31ae61ce6d7d6ab6afec20fd6bd 内置了 "Agnes AI"
# 免费模型的 API Key。该 Key 于 2026-09 一度从源码移除（S-01），后经维护者
# 决策恢复为应用自带的共享凭据（内置免费模型，开箱即用）。
#
# ⚠️ 说明：该 Key 是应用级共享凭据，泄露面等同于应用本身；由维护者通过
# crates/desktop/wth-desktop/src/main.rs 的 BUILTIN_AGNES_API_KEY 常量统一
# 轮换，各安装实例下次启动自动覆盖旧值。除下方豁免项外的任何密钥仍会被
# secret-scan 工作流拒绝。

[allowlist]
  description = "内置 Agnes 免费模型的共享 Key（应用自带，故意入库，可轮换）"
  # 历史提交（Key 首次引入）+ 当前内置常量所在路径
  commits = [
    "abd3978798bab31ae61ce6d7d6ab6afec20fd6bd",
  ]
  paths = [
    '''crates/desktop/wth-desktop/src/main\.rs$''',
  ]
