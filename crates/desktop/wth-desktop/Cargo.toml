[package]
name = "wth-desktop"
version = "2.1.0"
edition.workspace = true
description = "Wide Thought Host — Desktop Agent Application"
license = "Apache-2.0"

[[bin]]
name = "wth-desktop"
path = "src/main.rs"

[dependencies]
# Tauri v2 core
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"

# WTH core crates (local — package names retained for compatibility)
wth-agent = { path = "../../codegen/wth-agent" }
wth-config = { path = "../../codegen/wth-config" }
wth-config-types = { path = "../../codegen/wth-config-types" }
wth-models = { path = "../../codegen/wth-models" }
wth-tool-protocol = { path = "../../common/wth-tool-protocol" }
wth-tool-runtime = { path = "../../common/wth-tool-runtime" }
wth-tool-types = { path = "../../common/wth-tool-types" }

# xAI shell crates (for Agent runtime)
wth-shell = { path = "../../codegen/xai-grok-shell" }
wth-tools = { path = "../../codegen/xai-grok-tools" }
wth-mcp = { path = "../../codegen/xai-grok-mcp" }
wth-sampler = { path = "../../codegen/xai-grok-sampler" }
wth-memory = { path = "../../codegen/xai-grok-memory" }
wth-sandbox = { path = "../../codegen/xai-grok-sandbox" }
wth-secrets = { path = "../../codegen/xai-grok-secrets" }
wth-shared = { path = "../../codegen/xai-grok-shared" }

# Async runtime
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
portable-pty = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
fs2 = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
# A-03: Windows 子进程 containment（Job Object）
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# NOTE: package-level [profile.*] is ignored in a workspace.
# Release strip/LTO is controlled by the workspace root Cargo.toml
# ([profile.release] strip=true) and the tauri build pipeline.

[dev-dependencies]
tempfile = { workspace = true }
