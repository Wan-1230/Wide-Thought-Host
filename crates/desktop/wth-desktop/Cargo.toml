[package]
name = "wth-desktop"
version = "2.1.0"
edition.workspace = true
description = "Wide Thought Host — Desktop Agent Application"
license = "Apache-2.0"

[[bin]]
name = "wth-desktop"
path = "src/main.rs"

[dependencies]
# Tauri v2 core
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"

# WTH kernel crates actually referenced by src/ (see scripts/arch/check_arch.py
# rule `dead_path_dep` — declaring a crate here without using it costs a full
# compile of its dependency closure).
#   xai_grok_config::* — config loading (21 refs)
#   xai_grok_shell::*  — ACP kernel bridge, ipc/acp_bridge.rs (2 refs)
# The desktop's own agent loop, tools, MCP client, memory, and Windows sandbox
# are self-contained under src/ and do NOT link the kernel crates. When the
# unified kernel (`kernel_agent`) becomes the default path, re-add only what
# the routing actually consumes.
wth-config = { path = "../../codegen/wth-config" }
wth-shell = { path = "../../codegen/xai-grok-shell" }

# Async runtime
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
portable-pty = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
fs2 = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
# A-03: Windows 子进程 containment（Job Object）
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# NOTE: package-level [profile.*] is ignored in a workspace.
# Release strip/LTO is controlled by the workspace root Cargo.toml
# ([profile.release] strip=true) and the tauri build pipeline.

[dev-dependencies]
tempfile = { workspace = true }
