[package]
license = "Apache-2.0"
name = "wth-mcp-server"
version = "0.1.0"
edition.workspace = true
description = "F-07: 把 WTH 工作区以 MCP (Model Context Protocol) 服务器形式暴露给其他 IDE/Agent。"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
