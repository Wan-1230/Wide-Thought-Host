[package]
license = "Apache-2.0"
name = "wth-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the sampling / chat-completion API layer"

[lib]
name = "xai_grok_sampling_types"

[dependencies]
async-openai = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wth-compaction = { path = "../../common/xai-grok-compaction" }
wth-tools = { path = "../xai-grok-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
