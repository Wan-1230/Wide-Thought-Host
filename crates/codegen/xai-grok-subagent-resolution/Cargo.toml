[package]
license = "Apache-2.0"
name = "wth-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Subagent configuration resolution: merges persona, role, and spawn-time overrides into a resolved spec"

[lib]
name = "xai_grok_subagent_resolution"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wth-sampling-types = { path = "../xai-grok-sampling-types" }
wth-tools = { path = "../xai-grok-tools" }
wth-tool-types.workspace = true
# TODO(phase2): add these when resolve_subagent_spec() composition is implemented:
# xai-grok-agent = { path = "../wth-agent" }  # AgentDefinition lookup
# xai-fast-worktree = { path = "../xai-fast-worktree" }  # worktree creation

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
