[package]
license = "Apache-2.0"
name = "wth-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[lib]
name = "xai_grok_http"

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wth-auth = { workspace = true, features = ["middleware"] }
wth-sampler = { path = "../xai-grok-sampler" }
wth-telemetry = { workspace = true }
wth-version = { workspace = true }
wth-workspace = { workspace = true }

[lints]
workspace = true
