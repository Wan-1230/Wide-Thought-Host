# S-01（PRD v1.1）：密钥泄漏扫描
#
# 防止硬编码 API Key 再次进入仓库（历史教训：桌面端 main.rs 曾内置
# Agnes AI Key）。gitleaks 扫描全部历史与工作区；基线豁免见
# .gitleaks.toml（如有）。RROD 中承诺的常驻扫描门禁。

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每日 02:30 UTC 扫描一次（含全量历史）
    - cron: "30 2 * * *"

jobs:
  gitleaks:
    name: Detect hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
