name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "crates/desktop/**"
      - ".github/workflows/desktop-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "crates/desktop/**"
      - ".github/workflows/desktop-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  test-and-build:
    name: 测试与构建
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 单元测试
        shell: bash
        run: cargo test -p wth-desktop

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/wth-desktop/ui/package-lock.json

      - name: 安装前端依赖
        working-directory: crates/desktop/wth-desktop/ui
        run: npm ci

      - name: 前端单元测试
        working-directory: crates/desktop/wth-desktop/ui
        run: npm run test

      - name: 前端类型检查与构建
        working-directory: crates/desktop/wth-desktop/ui
        run: npm run build

  package:
    name: 打包安装包（NSIS/MSI）
    runs-on: windows-latest
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/wth-desktop/ui/package-lock.json

      - name: 安装前端依赖
        working-directory: crates/desktop/wth-desktop/ui
        run: npm ci

      - name: Tauri 打包
        working-directory: crates/desktop/wth-desktop
        run: |
          $env:Path = "C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\usr\bin;" + $env:Path
          .\ui\node_modules\.bin\tauri.cmd build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: wth-desktop-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: wth-desktop-installers
          path: installers

      - name: 计算 SHA-256 校验和
        working-directory: installers
        run: |
          sha256sum *.exe *.msi > sha256sums.txt
          cat sha256sums.txt

      - name: 生成发布说明
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            awk "/^# v[0-9]+\.[0-9]+\.[0-9]+/{p=1} p" RELEASE_NOTES.md | head -80 > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "### 自动生成发布说明" > /tmp/notes.md
            git log --oneline "${{ github.event.repository.default_branch }}..HEAD" | head -30 >> /tmp/notes.md || true
          fi
          cat /tmp/notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd installers
          gh release create "${{ github.ref_name }}" \
            ./*.exe ./*.msi sha256sums.txt \
            --repo "${{ github.repository }}" \
            --title "WTH Desktop ${{ github.ref_name }}" \
            --notes-file /tmp/notes.md
