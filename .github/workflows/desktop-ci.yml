name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - "crates/desktop/**"
      - ".github/workflows/desktop-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "crates/desktop/**"
      - ".github/workflows/desktop-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  test-and-build:
    name: 测试与构建
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust 单元测试
        shell: bash
        run: cargo test -p wth-desktop

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/wth-desktop/ui/package-lock.json

      - name: 安装前端依赖
        working-directory: crates/desktop/wth-desktop/ui
        run: npm ci

      - name: 前端单元测试
        working-directory: crates/desktop/wth-desktop/ui
        run: npm run test

      - name: 前端类型检查与构建
        working-directory: crates/desktop/wth-desktop/ui
        run: npm run build

  package:
    name: 打包安装包（NSIS/MSI）
    runs-on: windows-latest
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/wth-desktop/ui/package-lock.json

      - name: 安装前端依赖
        working-directory: crates/desktop/wth-desktop/ui
        run: npm ci

      - name: Tauri 打包
        working-directory: crates/desktop/wth-desktop
        run: |
          $env:Path = "C:\Program Files\Git\mingw64\bin;C:\Program Files\Git\usr\bin;" + $env:Path
          .\ui\node_modules\.bin\tauri.cmd build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: wth-desktop-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error