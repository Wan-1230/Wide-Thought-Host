# Wide Thought Host (WTH) CI — governance, lint, tests, and the `wth` binary.
#
# Layout:
#   fmt → hygiene → architecture (ratchet) → clippy → tests → audit → build
# The governance jobs compile nothing and finish in seconds; they exist because
# a package rename silently rotted this file's own `cargo -p` arguments, and the
# privacy gates below are only as real as the names that invoke them.
# Scoped for this monorepo: full-workspace clippy -D warnings is not practical
# on the upstream snapshot; clippy covers core crates + the pager
# binary surface. Tests stay a separate fast job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Pin matches rust-toolchain.toml (manual bumps only).
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── Repository governance (no compilation, seconds) ────────────────────────
  # These two jobs keep the rest of the workflow honest: the rename that broke
  # this file's own `-p` arguments is exactly the drift they catch.
  hygiene:
    name: Governance gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Workflow package and path references
        run: python scripts/check_workflow_pkg_names.py --verbose

      - name: Desktop version surfaces
        run: python scripts/check_version_sync.py --verbose

  architecture:
    name: Architecture (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # --changed diffs against the base branch, which needs history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check
        # On a PR only judge changed files; on main fail on anything outside the
        # frozen baseline so a landed violation cannot hide.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/arch/check_arch.py --changed --base "origin/${{ github.base_ref }}"
          else
            python scripts/arch/check_arch.py
          fi

      - name: Report and graph artifacts
        if: always()
        run: |
          mkdir -p architecture-report
          python scripts/arch/check_arch.py report > architecture-report/architecture.md
          python scripts/arch/dep_graph.py --layered > architecture-report/crates.dot
          python scripts/arch/dep_graph.py --mermaid > architecture-report/crates.mmd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-report
          path: architecture-report/

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          cache-targets: "true"

      - name: Clippy privacy-critical crates
        # --no-deps: lint only these packages, not the full monorepo graph
        # (upstream crates still carry clippy noise). -D warnings on our
        # privacy surface.
        run: |
          cargo clippy --no-deps \
            -p wth-version \
            -p xai-mixpanel \
            -p wth-telemetry \
            -p wth-update \
            --lib \
            -- -D warnings

      - name: Clippy wth binary crate
        # Thin entry crate for the community CLI; --no-deps keeps the job
        # from re-linting the whole pager dependency tree.
        run: |
          cargo clippy --no-deps \
            -p wth-pager-bin \
            --bins \
            -- -D warnings

  # ── Tests ─────────────────────────────────────────────────────────────────
  test-privacy:
    name: Privacy tests
    runs-on: ubuntu-latest
    # Full update suite + feature-enabled installer tests can be slow.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: privacy-tests
          cache-targets: "true"

      - name: Test privacy-critical crates
        run: |
          # Crates that compile cleanly as lib tests in the open-source
          # snapshot. Full wth-shell --lib currently fails upstream
          # (missing test helpers / partial monorepo cut) — so we filter to
          # privacy resolver tests that do compile when the crate builds.
          cargo test -p wth-version --lib
          cargo test -p xai-mixpanel --lib
          cargo test -p wth-telemetry --lib default_is_privacy
          # Default product build: full update crate suite (lib + integration
          # tests that do NOT require installer mocks). Installer-mechanic
          # tests are behind `updater-integration-tests` and compile empty
          # without the feature.
          cargo test -p wth-update
          # Focused privacy filters (also covered above; keep for clarity).
          cargo test -p wth-update --lib privacy -- --nocapture
          cargo test -p wth-update --lib env_cannot_disable -- --nocapture
          # Installer mechanics against local mocks (feature + env required).
          # IMPORTANT: cargo's `--tests` also runs library unit tests. With the
          # feature compiled in and GORK_TEST_ALLOW_UPDATE=1 in the process
          # env, privacy unit tests that assert "gate stays on" would fail.
          # Target only the installer integration test binaries by name.
          GORK_TEST_ALLOW_UPDATE=1 cargo test -p wth-update \
            --features updater-integration-tests \
            --test test_install_internal \
            --test test_blitz_cancel \
            --test test_check_status_regression \
            --test test_concurrent_convergence \
            --test test_downgrade_matrix
          # Telemetry / trace resolvers: env/config/remote cannot re-enable.
          cargo test -p wth-shell --test privacy_resolvers -- --nocapture

      - name: Static install chokepoint inventory
        run: |
          set -euo pipefail
          # Product install entry must gate on vendor_auto_update_forbidden.
          grep -n 'vendor_auto_update_forbidden' \
            crates/codegen/xai-grok-update/src/auto_update.rs \
            crates/codegen/xai-grok-update/src/minimum_version.rs
          # run_install_script must contain the privacy early return.
          grep -n 'if vendor_auto_update_forbidden' \
            crates/codegen/xai-grok-update/src/auto_update.rs
          # Default internal bases must still be the vendor CDN (so the gate
          # is what blocks them — not a silent empty list).
          grep -n 'https://x.ai/cli' crates/codegen/xai-grok-update/src/version.rs

  # License / provenance / duplicate-version gate. Advisory exemptions are shared
  # with cargo-audit: edit .cargo/audit.toml, then run
  # `python scripts/sync_advisory_ignore.py` and commit both files.
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Pinned to the version the config was validated against (see the header
      # comment in cargo-deny.toml) so a cargo-deny release cannot silently
      # change what we gate on.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2 --debug

      # cargo-deny only auto-discovers `deny.toml`; without --config it falls back
      # to an EMPTY allow list and rejects every crate. Never drop this flag.
      - name: Check
        run: cargo deny --config cargo-deny.toml check

  # Supply-chain hard gate: fails on any vulnerability not ignored in audit.toml.
  # Ignore list is residual monorepo debt (rsa unfixed; quick-xml major pin).
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (hard gate)
        run: |
          set -euo pipefail
          # Fail on unignored vulnerabilities. Unmaintained/unsound/yanked
          # packages are warned by default; do not use --deny warnings yet
          # (large monorepo has residual unmaintained transitive crates).
          cargo audit 2>&1 | tee cargo-audit.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-log
          path: cargo-audit.log
          if-no-files-found: ignore
          retention-days: 14

  # ── Build ─────────────────────────────────────────────────────────────────
  build-wth:
    name: Build wth
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler pkg-config libssl-dev cmake libclang-dev \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-wth
          cache-targets: "true"

      - name: Build wth (release)
        # ubuntu-latest: no MinGW here — that PATH line belongs to
        # build-wth-windows only.
        run: cargo build -p wth-pager-bin --release

      - name: Smoke wth CLI
        run: |
          set -euo pipefail
          BIN=target/release/wth
          test -x "$BIN"
          "$BIN" --version
          HELP=$("$BIN" --help)
          echo "$HELP" | head -20
          echo "$HELP" | grep -q 'Wide Thought Host'
          echo "$HELP" | grep -q 'Usage: wth'
          # argv0 mapping: binary named wth must not be forced back to grok
          echo "smoke ok"

      - name: Upload wth binary
        uses: actions/upload-artifact@v7
        with:
          name: wth-linux-x86_64
          path: target/release/wth
          if-no-files-found: error
          retention-days: 14

  # Release-binary network capture: CONNECT proxy logs destinations; fail if
  # denylisted privacy/vendor hosts appear (no MITM required).
  privacy-egress:
    name: Privacy egress capture
    needs: [build-wth]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download wth binary
        uses: actions/download-artifact@v8
        with:
          name: wth-linux-x86_64
          path: target/release

      - name: Run privacy egress check
        run: |
          set -euo pipefail
          chmod +x target/release/wth scripts/privacy_egress_check.sh
          export PRIVACY_EGRESS_WORKDIR="${RUNNER_TEMP}/wth-privacy-egress"
          mkdir -p "$PRIVACY_EGRESS_WORKDIR"
          WTH_BIN=target/release/wth ./scripts/privacy_egress_check.sh

      - name: Upload egress host log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: privacy-egress-hosts
          path: ${{ runner.temp }}/wth-privacy-egress/**
          if-no-files-found: ignore
          retention-days: 14
# ================= Windows =================
  # Windows is not covered by the Linux jobs above; keep a dedicated build +
  # smoke job so cross-platform regressions (Unix-only paths, PE stack size,
  # GNU vs MSVC linkers) surface in CI instead of only on developer machines.
  build-wth-windows:
    name: Build wth (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Vendored Windows protoc (ships bin/ + include/ as siblings).
      PROTOC: ${{ github.workspace }}\bin\protoc-win64\bin\protoc.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (GNU)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt

      - name: Install MinGW-w64 (GNU linker)
        shell: pwsh
        run: choco install mingw --no-progress -y

      - name: Build wth (release)
        shell: pwsh
        run: |
          # MinGW-w64 from choco installs to C:\tools\mingw64\bin; make sure it is on PATH.
          $env:Path = 'C:\tools\mingw64\bin;' + $env:Path
          cargo build -p wth-pager-bin --release

      - name: Smoke wth CLI
        shell: pwsh
        run: |
          target\release\wth.exe --version
          $help = target\release\wth.exe --help
          if ($help -notmatch "Wide Thought Host") { throw "help banner missing" }
          if ($help -notmatch "Usage: wth") { throw "usage line missing" }
          Write-Host "smoke ok"

      - name: Check PE stack reserve (>= 8MB)
        shell: pwsh
        run: |
          $path = "target\release\wth.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          # PE32+ OptionalHeader: SizeOfStackReserve at +0x48 from the optional header start.
          $stack = [BitConverter]::ToUInt32($bytes, $peOffset + 24 + 0x48)
          Write-Host "SizeOfStackReserve = $stack bytes"
          if ($stack -lt 8388608) { throw "stack reserve too small: $stack" }

      - name: Upload wth binary
        uses: actions/upload-artifact@v7
        with:
          name: wth-windows-x86_64
          path: target/release/wth.exe
          if-no-files-found: error
          retention-days: 14
